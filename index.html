<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071a2d" />
    <meta
      name="description"
      content="Best Traveler is coming soon. Explore the world. Respect it. Discover, play, learn, travel smart, and connect."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Best Traveler — Coming Soon" />
    <meta
      property="og:description"
      content="Explore the world. Respect it. Your next adventure awaits."
    />
    <meta property="og:image" content="assets/island-coast.jpg" />
    <title>Best Traveler — Coming Soon</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/island-coast.jpg" as="image" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="site-card">
        <header class="site-header" aria-label="Best Traveler">
          <img class="brand-mark" src="assets/favicon.svg" alt="" width="42" height="42" />
          <p class="eyebrow">A new journey begins</p>
          <h1>BEST TRAVELER</h1>
          <p class="brand-line">Explore the World. Respect It.</p>
        </header>

        <figure class="hero-image">
          <img
            src="assets/island-coast.jpg"
            alt="A green mountain range overlooking a tropical beach and turquoise sea at sunset"
            width="1672"
            height="941"
            fetchpriority="high"
          />
        </figure>

        <section class="introduction" aria-labelledby="welcome-heading">
          <h2 id="welcome-heading">Your next adventure awaits.</h2>
          <p>Discover. Play. Learn. Travel Smart. Connect.</p>
          <div class="status" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            Coming Soon
          </div>
        </section>

        <footer class="site-footer">
          <span class="footer-rule" aria-hidden="true"></span>
          <p>Made for curious travelers and the places they explore.</p>
          <small>© 2026 Best Traveler</small>
        </footer>
      </div>
    </main>
  </body>
</html>
